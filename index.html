<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151a30">
<meta name="description" content="Map tool for Jet Lag: The Game's Hide + Seek home game in Washington, DC — hiding zones, questions and live elimination.">
<title>Hide + Seek DC · Jet Lag home-game map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23151a30'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23ffd23f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ffd23f'/%3E%3C/svg%3E">
<style>:root{
  --ink:#151a30;--ink2:#4a5170;--mute:#8b91a8;--line:#e5e7ef;--line2:#d5d9e6;--bg:#f5f6fa;--card:#fff;--brand:#ffd23f;
  --match:#2f6fde;--measure:#12936a;--thermo:#e8590c;--radar:#c2255c;--custom:#6741d9;--ok:#12936a;--bad:#c92a2a;
  --r:12px;--shadow:0 8px 28px rgba(21,26,48,.14),0 1px 3px rgba(21,26,48,.08);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:14px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;display:flex}
#panel{width:400px;flex:none;display:flex;flex-direction:column;background:var(--card);border-right:1px solid var(--line);z-index:1000;min-height:0;position:relative}
#mapwrap{position:relative;flex:1;min-width:0}
#map{position:absolute;inset:0;background:#e8eaf0}
.hs-canvas{position:absolute;left:0;top:0;pointer-events:none}
#map.picking,#map.picking .leaflet-interactive{cursor:crosshair!important}

/* header */
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--ink);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em}
.brand small{color:var(--mute);font-size:12px}
.phead .sp{flex:1}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:16px}
.icon-btn:hover{background:var(--bg)}

.summary{margin:0 16px 10px;padding:12px 14px;border-radius:var(--r);background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px}
.summary .big{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1}
.summary .lbl{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.summary .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;align-self:center}
.summary .bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s}
.summary .tag{font-size:10px;background:var(--brand);color:var(--ink);border-radius:4px;padding:1px 5px;font-weight:700;margin-left:6px;vertical-align:middle}

.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;white-space:nowrap;border:0;background:none;padding:10px 4px 9px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;font-size:13px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--bg);color:var(--ink2);font-size:11px;margin-left:3px}
.tabbody{flex:1;overflow:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch;min-height:0}
.tabbody section[hidden]{display:none}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:18px 0 8px;font-weight:700}
h3:first-child{margin-top:0}
.muted{color:var(--mute)} .small{font-size:12px}
p{margin:6px 0}

/* ask cards */
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qadd{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;transition:transform .08s,box-shadow .15s}
.qadd:hover{box-shadow:var(--shadow)} .qadd:active{transform:scale(.98)}
.qadd::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.qadd b{font-size:14px;display:flex;align-items:center;gap:6px}
.qadd b .ic{width:22px;height:22px;border-radius:6px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:12px}
.qadd span{font-size:11.5px;color:var(--ink2);line-height:1.3}

/* question list */
.qitem{border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 14px;margin-bottom:8px;position:relative;background:#fff}
.qitem::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
.qitem.off{opacity:.55}
.qitem .top{display:flex;align-items:center;gap:8px}
.qitem .num{width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.qitem .t{font-weight:650;flex:1;min-width:0}
.qitem .sub{font-size:12px;color:var(--ink2);margin:4px 0 0 30px}
.qitem .acts{display:flex;gap:4px;margin:8px 0 0 30px;flex-wrap:wrap}
.ans{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--bg);white-space:nowrap}
.ans.yes{background:#e6f7ef;color:#0b6e4f}.ans.no{background:#fdecec;color:#a61e1e}
.badge{font-size:11px;padding:1px 7px;border-radius:10px;background:#fff4db;color:#8a5a00}
.badge.err{background:#fdecec;color:#a61e1e}

.btn{border:1px solid var(--line2);background:#fff;border-radius:9px;padding:8px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--bg)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2a3150}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,input[type=number],input[type=text],input[type=search],textarea{border:1px solid var(--line2);border-radius:9px;padding:7px 9px;background:#fff;max-width:100%}
select.sm{padding:4px 6px;font-size:12px;border-radius:8px}
textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace}

/* editor */
.editor{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;z-index:5}
.editor[hidden]{display:none}
.edhead{padding:14px 16px 12px;border-bottom:1px solid var(--line);position:relative}
.edhead::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.edhead .kind{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--c)}
.edhead .ask{font-size:16px;font-weight:650;margin-top:2px;line-height:1.3}
.edbody{flex:1;overflow:auto;padding:14px 16px}
.edfoot{border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safe-b));display:flex;gap:8px}
.edfoot .sp{flex:1}
.field{margin-bottom:16px}
.field>label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.loc{border:1px dashed var(--line2);border-radius:10px;padding:8px 10px}
.loc.set{border-style:solid;background:var(--bg)}
.locval{font-weight:600;margin-bottom:6px;font-size:13px}
.locval small{display:block;font-weight:400;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:20px;padding:6px 12px;font-weight:600;font-size:13px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px 8px;font-weight:700}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on.y{background:#12936a;color:#fff}.seg button.on.n{background:#c92a2a;color:#fff}
.info{border-radius:10px;background:var(--bg);padding:10px 12px;font-size:13px;margin-bottom:14px}
.info.warn{background:#fff4db}
.preview{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.preview div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.preview b{font-size:18px;display:block}
.preview span{font-size:11.5px;color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* zones */
.linechips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{border:2px solid var(--lc);border-radius:20px;padding:5px 11px 5px 8px;background:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.lchip i{width:12px;height:12px;border-radius:50%;background:var(--lc)}
.lchip.off{border-color:var(--line2);color:var(--mute);text-decoration:line-through;background:var(--bg)}
.lchip.off i{opacity:.35}
.strow{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line)}
.strow .nm{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.strow.dead .nm{color:var(--mute);text-decoration:line-through}
.dots{display:inline-flex;gap:2px}.dots i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pbar{width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}.pbar i{display:block;height:100%;background:var(--ok)}
.pct{width:34px;text-align:right;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}

/* layers */
.lrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.lrow label{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.lrow .sw{width:18px;height:18px;border-radius:5px;flex:none;display:grid;place-items:center;font-size:10px;color:#fff}
.lrow .st{font-size:11px;color:var(--mute);white-space:nowrap}
.toggle{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line2);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.toggle:checked{background:var(--ink)}.toggle:checked::after{left:16px}
.radios label{display:flex;gap:8px;align-items:center;padding:5px 0;cursor:pointer}

/* custom shapes */
.citem{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.citem .t{flex:1;font-weight:600;font-size:13px}

/* map chrome */
#mapchip{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:800;background:var(--ink);color:#fff;border-radius:20px;padding:6px 14px;font-weight:650;font-size:13px;box-shadow:var(--shadow);white-space:nowrap;display:none;pointer-events:none}
#mapchip.busy{display:block}
#pickbar{position:absolute;left:12px;right:60px;top:12px;z-index:900;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pickbar[hidden]{display:none}
#pickbar .msg{flex:1;min-width:160px;font-size:13px}
#pickbar .msg b{display:block;font-size:14px}
.mapbtns{position:absolute;right:10px;top:96px;z-index:800;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:34px;height:34px;border-radius:8px;border:0;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.25);font-size:16px;display:grid;place-items:center}
.leaflet-control-zoom a{width:34px!important;height:34px!important;line-height:34px!important}
#tip{position:absolute;z-index:950;pointer-events:none;background:rgba(21,26,48,.92);color:#fff;padding:4px 8px;border-radius:6px;font-size:12px;white-space:nowrap;display:none;transform:translate(12px,-50%)}
.legend{position:absolute;left:12px;bottom:22px;z-index:800;background:rgba(255,255,255,.94);border-radius:10px;box-shadow:var(--shadow);padding:7px 10px;font-size:11.5px;display:flex;gap:12px;align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hs-pin{background:none;border:0}
.hs-pin div{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.hs-pin span{position:absolute;left:0;top:6px;width:26px;text-align:center;color:#fff;font-weight:800;font-size:11px}
.leaflet-popup-content{margin:12px 14px;font-size:13px}
.pop b{font-size:14px}.pop .btnrow{margin-top:8px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:3000;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;font-size:13px;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(21,26,48,.45);z-index:2500;display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
#modal .box{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:18px;box-shadow:var(--shadow)}
#modal h2{margin:0 0 8px;font-size:17px}
#modal .btnrow{justify-content:flex-end;margin-top:14px}
.help li{margin-bottom:6px}
kbd{font:11px ui-monospace,monospace;background:var(--bg);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.handle{display:none}
.mobile-only{display:none}

@media (max-width:820px){
  #app{display:block}
  #mapwrap{position:absolute;inset:0}
  #panel{position:absolute;left:0;right:0;bottom:0;width:auto;height:48%;border-right:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(21,26,48,.18);transition:height .25s ease}
  #panel.min{height:150px} #panel.max{height:calc(100% - 56px)}
  .handle{display:block;width:44px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0;border:0;padding:0}
  .handlehit{position:absolute;left:0;right:0;top:0;height:22px;border:0;background:none}
  .phead{padding:8px 14px 8px}
  .phead .brand small{display:none}
  .logo{width:32px;height:32px}
  .summary{margin:0 14px 8px;padding:9px 12px}
  .summary .big{font-size:21px}
  .mobile-only{display:grid}
  #mapchip{display:block}
  .legend{display:none}
  .mapbtns{top:96px}
  #pickbar{right:56px}
  .tabbody{padding:12px 14px calc(20px + var(--safe-b))}
}
</style>

</head>
<body>
<div id="app">
  <aside id="panel">
    <button class="handlehit mobile-only" data-act="sheet" aria-label="Resize panel"><span class="handle"></span></button>
    <header class="phead">
      <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="none" stroke="#ffd23f" stroke-width="3.2"/><circle cx="16" cy="16" r="3.2" fill="#ffd23f"/><path d="M16 1v6M16 25v6M1 16h6M25 16h6" stroke="#ffd23f" stroke-width="2.6" stroke-linecap="round"/></svg></div>
      <div class="brand"><b>Hide + Seek DC</b><small>Jet Lag home-game map · Washington Metro</small></div>
      <div class="sp"></div>
      <button class="icon-btn mobile-only" data-act="sheet" aria-label="Expand or collapse panel" id="sheetBtn">▴</button>
    </header>
    <div class="summary" id="summary"></div>
    <nav class="tabs" role="tablist">
      <button data-act="tab" data-tab="q" class="on">Questions</button>
      <button data-act="tab" data-tab="z">Zones</button>
      <button data-act="tab" data-tab="l">Layers</button>
      <button data-act="tab" data-tab="d">Draw</button>
      <button data-act="tab" data-tab="g">Game</button>
    </nav>
    <div class="tabbody" id="tabbody">
      <section data-pane="q" id="paneQ"></section>
      <section data-pane="z" id="paneZ" hidden></section>
      <section data-pane="l" id="paneL" hidden></section>
      <section data-pane="d" id="paneD" hidden></section>
      <section data-pane="g" id="paneG" hidden></section>
    </div>
    <div class="editor" id="editor" hidden></div>
  </aside>
  <main id="mapwrap">
    <div id="map"></div>
    <div id="mapchip"></div>
    <div id="pickbar" hidden></div>
    <div class="mapbtns">
      <button data-act="fit" title="Zoom to remaining zones" aria-label="Zoom to remaining zones">⤢</button>
      <button data-act="locate" title="Show my location" aria-label="Show my location">◎</button>
    </div>
    <div class="legend"><span><i style="background:rgba(21,26,48,.6)"></i>Ruled out</span><span><i style="background:rgba(21,26,48,.25)"></i>Not ruled out, outside zones</span><span><i style="background:#fff;border:2px solid #151a30"></i>Still possible</span></div>
    <div id="tip"></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden></div>

  if (d.kind === 'poly' && d.pts.length) { c.beginPath(); d.pts.forEach((p, i) => { const s = V.ll(p[0], p[1]); i ? c.lineTo(s[0], s[1]) : c.moveTo(s[0], s[1]); }); if (d.pts.length > 2) { c.closePath(); c.fill(); } c.stroke(); d.pts.forEach(p => { const s = V.ll(p[0], p[1]); c.beginPath(); c.arc(s[0], s[1], 5, 0, 7); c.fillStyle = '#6741d9'; c.fill(); }); }
  if (d.kind === 'circle' && d.c) { const s = V.ll(d.c[0], d.c[1]); c.beginPath(); c.arc(s[0], s[1], 6, 0, 7); c.fillStyle = '#6741d9'; c.fill(); }

}

function targetPicker() {
  const q = ED.q, box = $('#edTarget'); if (!box || !q.p) { if (box) box.innerHTML = ''; return; }
  const s = toXY(q.p[0], q.p[1]), C = CATS[q.cat];
  if (q.cat === 'line') {
    const near = nearestStation(s), cur = q.line || near.lines[0];
    box.innerHTML = `<label>Seeker's line <span class="muted" style="font-weight:400">(nearest station: ${esc(near.name)})</span></label><div class="chips">${LINE_ORDER.map(l => `<button class="chip ${cur === l ? 'on' : ''}" data-act="edline" data-val="${l}" style="${cur === l ? `background:${LINES[l].c};border-color:${LINES[l].c}` : `border-color:${LINES[l].c}`}">${LINES[l].n}</button>`).join('')}</div>`;
    return;
  }
  if (q.cat === 'namelen') {
    const st = q.station ? ST_BY[q.station] : nearestStation(s);
    const N = q.len != null && q.len !== '' ? q.len : nameLen(st.name);
    box.innerHTML = `<label>Seeker's station</label><select data-act="edstation" style="width:100%">${STATIONS.slice().sort((a, b) => a.name.localeCompare(b.name)).map(x => `<option value="${x.code}" ${x.code === st.code ? 'selected' : ''}>${esc(x.name)} (${nameLen(x.name)})</option>`).join('')}</select>
      <div class="row"><span class="muted small">Length used:</span><input type="number" id="edLen" min="1" value="${N}" style="width:80px"><span class="muted small">Rule set in the Game tab</span></div>`;
    return;
  }
  if (q.cat === 'state') {
    const cur = q.state || stateOf(s);
    box.innerHTML = `<label>Seeker is in</label><select data-act="edstate" style="width:100%">${['DC', 'MD', 'VA'].map(k => `<option value="${k}" ${cur === k ? 'selected' : ''}>${STATE_NAMES[k]}${!q.state && cur === k ? ' (detected)' : ''}</option>`).join('')}</select>`;
    return;
  }
  if (q.cat === 'custom') return;
  const d = q.cat === 'landmass' ? DS.landmass : DS[q.cat];
  if (!d || d.status !== 'ready') { box.innerHTML = ''; return; }
  if (q.cat === 'landmass') {
    const cur = q.land || landmassOf(s, d), list = kNearest(d.feats, s, 8, f => f.id, 40000);
    box.innerHTML = `<label>Seeker is on</label><select data-act="edland" style="width:100%"><option value="mainland" ${cur === 'mainland' ? 'selected' : ''}>The mainland</option>${list.map(n => `<option value="${d.feats[n.i].id}" ${cur === d.feats[n.i].id ? 'selected' : ''}>${esc(n.name || 'Unnamed island')} (${fmtDist(n.d)})</option>`).join('')}</select>`;
    return;
  }
  const kf = q.type === 'match' ? keyFn(q.cat) : (f => f.id);
  const near = kNearest(d.feats, s, 7, kf);
  const cq = ED.cq, curKey = q.target || (cq && cq.ok ? (q.type === 'match' ? cq.info.targetKey : cq.info.nearest && cq.info.nearest.id) : near[0] && near[0].key);
  box.innerHTML = `<label>Seeker's nearest ${esc(C.label.toLowerCase())} <span class="muted" style="font-weight:400">— change it if the map data is wrong</span></label>
    <select data-act="target" style="width:100%">${near.map((n, i) => `<option value="${esc(n.key)}" ${n.key === curKey ? 'selected' : ''}>${esc(n.name || '(unnamed)')} · ${fmtDist(n.d)}${i === 0 ? ' (nearest)' : ''}</option>`).join('')}</select>`;
}
let prevT = 0;
function refreshEditorInfo() {
  if (!ED) return;
  const cq = CQS.find(c => c.q === ED.q) || compileQ(ED.q); ED.cq = cq;
  const info = $('#edInfo');
  if (info) {
    info.className = 'info' + (cq.info.warn || (!cq.ok && !cq.pending) ? ' warn' : '');
    info.innerHTML = cq.pending ? `<span class="spin"></span>${esc(cq.msg)}` : cq.ok ? esc(cq.info.text || '') : esc(cq.msg || '');
  }
  const tgt = $('#edTarget'); if (tgt && !tgt.contains(document.activeElement)) targetPicker();
  clearTimeout(prevT); prevT = setTimeout(renderPreview, 120);
  const sv = $('#edSave'); if (sv) sv.disabled = !(cq.ok || cq.pending);
}
const ALT = { yes: 'no', no: 'yes', hotter: 'colder', colder: 'hotter', closer: 'further', further: 'closer' };
function renderPreview() {
  const box = $('#edPreview'); if (!box || !ED) return;
  const cq = ED.cq; if (!cq || !cq.ok) { box.innerHTML = ''; return; }
  const others = CQS.filter(c => c.q !== ED.q);
  const altQ = Object.assign({}, ED.q, { answer: ALT[ED.q.answer] });
  const altCQ = compileQ(altQ);
  const a = STATS, b = altCQ.ok ? computeStats(others.concat([altCQ]), baseOk) : null;
  const lab = v => ({ yes: ED.q.type === 'radar' ? 'Within' : 'Same', no: ED.q.type === 'radar' ? 'Not within' : 'Different', hotter: 'Hotter', colder: 'Colder', closer: 'Closer', further: 'Further' }[v]);
  const fmt = s => `<b>${s.zones} zones</b><span>${s.areaMi2.toFixed(2)} mi² left</span>`;
  box.innerHTML = `<div class="small muted" style="margin-bottom:6px">What each answer would leave (now: ${BASE_STATS.zones} zones):</div>
    <div class="preview"><div style="border-color:var(--ink)"><span>If “${lab(ED.q.answer)}” (shown)</span>${fmt(a)}</div>${b ? `<div><span>If “${lab(altQ.answer)}”</span>${fmt(b)}</div>` : ''}</div>`;
}
function syncDraftMarkers() {
  if (!ED) return clearDraftMarkers();
  const fields = ED.q.type === 'thermo' ? ['a', 'b'] : ['p', 't'];
  for (const f of ['p', 'a', 'b', 't']) {
    const v = fields.includes(f) ? ED.q[f] : null, m = draftMarkers[f];
    if (!v) { if (m) { m.remove(); delete draftMarkers[f]; } continue; }
    if (m) { m.setLatLng(v); continue; }
    const col = QT[ED.q.type].hex;
    const mk = L.marker(v, { draggable: true, autoPan: true, icon: L.divIcon({ className: 'hs-pin', html: `<div style="--c:${col}"></div><span>${f === 'a' ? 'A' : f === 'b' ? 'B' : f === 't' ? '★' : ''}</span>`, iconSize: [26, 26], iconAnchor: [13, 31] }) }).addTo(map);
    let dragT = 0; mk.on('drag', () => { const ll = mk.getLatLng(); ED.q[f] = [ll.lat, ll.lng]; if (performance.now() - dragT > 120) { dragT = performance.now(); recompute(); } });
    mk.on('dragend', () => { const ll = mk.getLatLng(); setField(f, [ll.lat, ll.lng]); });
    draftMarkers[f] = mk;
  }
}
function clearDraftMarkers() { Object.values(draftMarkers).forEach(m => m.remove()); draftMarkers = {}; }
function setField(f, ll) {
  if (!ED) return; ED.q[f] = ll; if (f === 'p') ED.prefilled = false;
  if (f === 'p' || f === 'b') lastSeeker = { ll, t: Date.now() };
  if (f === 'p') { delete ED.q.target; delete ED.q.state; delete ED.q.land; delete ED.q.station; delete ED.q.len; if (ED.q.cat === 'line') delete ED.q.line; }
  renderEditor(); syncDraftMarkers(); recompute();
  if (ED.q.type === 'thermo' && f === 'a' && !ED.q.b) setTimeout(() => pickField('b'), 50);
}
function pickField(f) {
  const msg = { p: ' where the seeker is.', a: ' where the seeker started (A).', b: ' where the seeker is now (B).', t: ' on the landmark.' }[f];
  startPick(msg, ll => setField(f, ll));
}
function saveEditor() {
  const q = ED.q; if (!q.id) q.id = uid(); q.enabled = true; q.t0 = q.t0 || Date.now();
  if (ED.orig) { const i = S.questions.findIndex(x => x.id === ED.orig); if (i >= 0) S.questions[i] = q; else S.questions.push(q); }
  else S.questions.push(q);
  save(); closeEditor(); toast('Question saved.');
}

/* ------------------------------ EVENTS ------------------------------ */
function setTab(t) {
  $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $$('#tabbody section').forEach(s => { s.hidden = s.dataset.pane !== t; });
  if (t === 'z') renderZones(); if (t === 'l') renderLayers(); if (t === 'd') renderDraw(); if (t === 'g') renderGame();
  if (isMobile() && $('#panel').classList.contains('min')) setSheet('mid');
}
function setSheet(s) { const p = $('#panel'); p.classList.toggle('min', s === 'min'); p.classList.toggle('max', s === 'max'); $('#sheetBtn').textContent = s === 'max' ? '▾' : '▴'; }
function cycleSheet() { const p = $('#panel'); setSheet(p.classList.contains('min') ? 'mid' : p.classList.contains('max') ? 'min' : 'max'); }
function qById(id) { return S.questions.find(q => q.id === id); }
function onAct(el, ev) {
  const a = el.dataset.act, id = el.dataset.id, code = el.dataset.code;
  switch (a) {
    case 'tab': return setTab(el.dataset.tab);
    case 'sheet': return cycleSheet();
    case 'add': return openEditor(NEW_Q[el.dataset.type]());
    case 'edit': { const q = qById(id); if (q) openEditor(JSON.parse(JSON.stringify(q)), id); return; }
    case 'flip': { const q = qById(id); if (q) { q.answer = ALT[q.answer]; save(); recompute(); } return; }
    case 'toggle': { const q = qById(id); if (q) { q.enabled = q.enabled === false; save(); recompute(); } return; }
    case 'focus': { const q = qById(id); const p = q && (q.p || q.b); if (p) map.setView(p, Math.max(map.getZoom(), 13)); if (isMobile()) setSheet('min'); return; }
    case 'del': return confirmBox('Delete this question?', 'It will be removed and the map will update.', 'Delete', () => { S.questions = S.questions.filter(q => q.id !== id); save(); recompute(); });
    case 'ed-cancel': return closeEditor();
    case 'ed-save': return saveEditor();
    case 'ed-del': { const oid = ED.orig; return confirmBox('Delete this question?', '', 'Delete', () => { S.questions = S.questions.filter(q => q.id !== oid); save(); closeEditor(); }); }
    case 'pick': return pickField(el.dataset.field);
    case 'gps': return gps(ll => setField(el.dataset.field, ll));
    case 'pick-gps': { const cb = PICK && PICK.cb; endPick(); if (cb) gps(cb); return; }
    case 'pick-cancel': return endPick();
    case 'dist': { if (el.dataset.val === 'custom') { ED.q.customDist = true; } else { ED.q.distMi = +el.dataset.val; delete ED.q.customDist; } renderEditor(); recompute(); return; }
    case 'ans': ED.q.answer = el.dataset.val; renderEditor(); recompute(); return;
    case 'edline': ED.q.line = el.dataset.val; renderEditor(); recompute(); return;
    case 'st-toggle': { const st = ST_BY[code], cur = STATS ? STATS.allowed[st.i] : 1; if (cur) S.stationOverride[code] = 'out'; else { if (S.stationOverride[code] === 'out') delete S.stationOverride[code]; if (!baseOk(st)) S.stationOverride[code] = 'in'; } save(); recompute(); map.closePopup(); return; }
    case 'st-seeker': { const st = ST_BY[code]; map.closePopup(); const f = ED.q.type === 'thermo' ? (ED.q.a ? 'b' : 'a') : 'p'; setField(f, st.ll.slice()); return; }
    case 'st-zoom': map.setView(ST_BY[code].ll, 16); map.closePopup(); return;
    case 'st-fly': { const st = ST_BY[code]; map.setView(st.ll, Math.max(15, map.getZoom())); if (isMobile()) setSheet('min'); setTimeout(() => openStationPopup(st), 300); return; }
    case 'st-reset': S.stationOverride = {}; save(); recompute(); return;
    case 'rline': { const l = el.dataset.l; if (S.ruledLines[l]) delete S.ruledLines[l]; else S.ruledLines[l] = true; save(); recompute(); return; }
    case 'retry': requestLoad(el.dataset.cat, true); return;
    case 'draw': return startDraw(el.dataset.kind);
    case 'draw-mode': DRAW.mode = el.dataset.val; renderDrawBar(); return;
    case 'draw-undo': DRAW.pts.pop(); renderDrawBar(); requestRedraw(); return;
    case 'draw-done': return finishDraw();
    case 'draw-cancel': return cancelDraw();
    case 'cflip': { const c = S.customs.find(x => x.id === id); c.mode = c.mode === 'keep' ? 'remove' : 'keep'; save(); recompute(); renderDraw(); return; }
    case 'ctoggle': { const c = S.customs.find(x => x.id === id); c.enabled = c.enabled === false; save(); recompute(); renderDraw(); return; }
    case 'cdel': S.customs = S.customs.filter(x => x.id !== id); save(); recompute(); renderDraw(); return;
    case 'fit': return fitRemaining();
    case 'locate': return locateMe();
    case 'share': return shareLink();
    case 'export': return exportBox();
    case 'import': return importBox();
    case 'reset': return confirmBox('Start a new game?', 'This clears all questions, custom shapes and line/station rule-outs on this device. Settings and cached map data stay.', 'Clear everything', () => { S.questions = []; S.customs = []; S.ruledLines = {}; S.stationOverride = {}; save(); recompute(); renderDraw(); toast('New game started.'); });
    case 'gkey': S.settings.googleKey = $('#gkey').value.trim(); save(); toast('Google key saved. Choose “Google Maps” in Layers.'); return;
    case 'clearcache': IDB.clear(); toast('Cached data cleared — it will reload as needed.'); return;
    case 'modal-close': return closeModal();
  }
}
function onChange(el) {
  const a = el.dataset.act;
  switch (a) {
    case 'stloc': if (el.value) setField(el.dataset.field, ST_BY[el.value].ll.slice()); return;
    case 'cat': ED.q.cat = el.value; delete ED.q.target; delete ED.q.line; delete ED.q.state; delete ED.q.land; delete ED.q.station; delete ED.q.len; renderEditor(); recompute(); return;
    case 'target': ED.q.target = el.value; recompute(); return;
    case 'edstation': ED.q.station = el.value; delete ED.q.len; renderEditor(); recompute(); return;
    case 'edstate': ED.q.state = el.value; recompute(); return;
    case 'edland': ED.q.land = el.value; recompute(); return;
    case 'lmode': S.lineMode = el.value; save(); recompute(); return;
    case 'stshow': zoneFilter.show = el.value; renderZones(); return;
    case 'basemap': setBasemap(el.value); return;
    case 'ov': S.layers[el.dataset.k] = el.checked; save(); requestRedraw(); return;
    case 'catl': { const cat = el.dataset.cat; S.layers.cats[cat] = el.checked; if (el.checked) { requestLoad(cat); if (cat === 'street') { if (map.getZoom() < 15) toast('Zoom in further to see named streets and paths.'); loadViewStreets(); } } save(); renderLayers(); requestRedraw(); return; }
    case 'set': { const k = el.dataset.k; S.settings[k] = k === 'radiusMi' ? +el.value : el.value; save(); if (k === 'radiusMi') { computeNeighbors(); GRID.cache.clear(); } recompute(); renderGame(); return; }
    case 'setb': S.settings[el.dataset.k] = el.checked; save(); GRID.cache.clear(); recompute(); return;
    case 'shade': S.settings.shade = +el.value; save(); requestRedraw(); return;
  }
}
function onInput(el) {
  if (el.id === 'edDist') { ED.q.distMi = +el.value; ED.q.customDist = true; recompute(); }
  else if (el.id === 'edLen') { ED.q.len = el.value === '' ? '' : +el.value; recompute(); }
  else if (el.id === 'edTName') { ED.q.tName = el.value; }
  else if (el.id === 'stsearch') { zoneFilter.q = el.value; renderZones(); }
  else if (el.dataset.act === 'shade') { S.settings.shade = +el.value; requestRedraw(); }
}
function fitRemaining() {
  if (!STATS) return; const R = zoneR(); let b = null;
  for (const st of STATIONS) if (STATS.allowed[st.i] && STATS.pct[st.i] > 0) { const dl = R / MLAT, dn = R / MLON; const bb = [[st.lat - dl, st.lng - dn], [st.lat + dl, st.lng + dn]]; b = b ? [[Math.min(b[0][0], bb[0][0]), Math.min(b[0][1], bb[0][1])], [Math.max(b[1][0], bb[1][0]), Math.max(b[1][1], bb[1][1])]] : bb; }
  if (!b) return toast('No zones remain — check your answers.');
  const mob = isMobile(), h = $('#panel').offsetHeight;
  map.fitBounds(b, { paddingTopLeft: [30, 60], paddingBottomRight: [30, mob ? h + 20 : 30], maxZoom: 16 });
}

/* ------------------------------ SHARE / MODALS ------------------------------ */
function gameJSON() { return JSON.stringify({ v: 1, questions: S.questions, customs: S.customs, ruledLines: S.ruledLines, lineMode: S.lineMode, stationOverride: S.stationOverride, settings: { radiusMi: S.settings.radiusMi, nameRule: S.settings.nameRule, nameSource: S.settings.nameSource, quadrants: S.settings.quadrants } }); }
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
function applyGame(j) {
  if (!j || j.v !== 1) throw new Error('Not a Hide + Seek DC game');
  S.questions = j.questions || []; S.customs = j.customs || []; S.ruledLines = j.ruledLines || {}; S.lineMode = j.lineMode || 'all'; S.stationOverride = j.stationOverride || {};
  Object.assign(S.settings, j.settings || {}); computeNeighbors(); GRID.cache.clear(); save(); recompute(); renderDraw(); renderGame();
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); return true; } catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e2) { } ta.remove(); return ok; } }
async function shareLink() {
  const url = location.href.split('#')[0] + '#g=' + b64e(gameJSON());
  if (await copyText(url)) toast('Share link copied. Teammates who open it can load this game.');
  else modal('Share link', `<textarea readonly>${esc(url)}</textarea>`, [['Close', null]]);
}
function exportBox() { modal('Export game', `<p class="small muted">Copy this text to back up or move the game.</p><textarea readonly id="exp">${esc(gameJSON())}</textarea>`, [['Copy', () => copyText($('#exp').value).then(ok => toast(ok ? 'Copied.' : 'Select the text and copy it.'))], ['Close', null]]); }
function importBox() { modal('Import game', '<p class="small muted">Paste an exported game. This replaces the current questions and shapes.</p><textarea id="imp"></textarea>', [['Import', () => { try { applyGame(JSON.parse($('#imp').value)); toast('Game imported.'); } catch (e) { toast('Import failed: ' + e.message); } }, true], ['Cancel', null]]); }
function checkHash() {
  const m = location.hash.match(/^#g=(.+)$/); if (!m) return;
  let j; try { j = JSON.parse(b64d(m[1])); } catch (e) { return toast('That share link looks broken.'); }
  modal('Load shared game?', `This link has <b>${(j.questions || []).length} question(s)</b> and <b>${(j.customs || []).length} shape(s)</b>. Loading it replaces what's on this device.`, [['Load game', () => { applyGame(j); history.replaceState(null, '', location.pathname + location.search); toast('Shared game loaded.'); }, true], ['Not now', () => history.replaceState(null, '', location.pathname + location.search)]]);
}
function modal(title, html, actions) {
  const m = $('#modal'); m.hidden = false;
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><div>${html}</div><div class="btnrow">${actions.map(([l, , pri], i) => `<button class="btn ${pri ? 'pri' : ''}" data-mi="${i}">${esc(l)}</button>`).join('')}</div></div>`;
  $$('[data-mi]', m).forEach(b => b.onclick = () => { const fn = actions[+b.dataset.mi][1]; closeModal(); if (fn) fn(); });
}
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; }
function confirmBox(title, text, okLabel, fn) { modal(title, `<p>${esc(text)}</p>`, [['Cancel', null], [okLabel, fn, true]]); }
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3800); }

/* ------------------------------ BOOT ------------------------------ */
function start() {
  map = L.map('map', { zoomControl: false, minZoom: 8, maxZoom: 19, zoomSnap: 0.25, zoomDelta: 0.5, wheelPxPerZoomLevel: 100, preferCanvas: true, maxBounds: [[37.9, -78.6], [39.9, -75.9]] });
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  L.control.zoom({ position: 'topright' }).addTo(map);
  map.fitBounds([[38.766, -77.491], [39.12, -76.844]], { padding: [16, 16] });
  if (isMobile()) map.setView([38.9, -77.06], 10.5);
  setBasemap(S.settings.basemap);
  initOverlay();
  map.on('click', onMapClick); map.on('mousemove', onMouseMove); map.on('mouseout', () => { $('#tip').style.display = 'none'; });
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'button')) return; onAct(el, e); });
  document.addEventListener('change', e => { const el = e.target.closest('[data-act]'); if (el && (el.tagName === 'SELECT' || el.tagName === 'INPUT')) onChange(el); });
  document.addEventListener('input', e => onInput(e.target));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (PICK) endPick(); else if (DRAW) cancelDraw(); else if (!$('#modal').hidden) closeModal(); } });
  for (const [cat, on] of Object.entries(S.layers.cats)) if (on) requestLoad(cat);
  restoreStreets().then(recompute);
  renderLayers(); renderDraw(); renderGame();
  doRecompute();
  checkHash();
}
window.__loadLeaflet(start);
</script>
